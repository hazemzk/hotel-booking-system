services:

  backend:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:1234@db:5432/hotel_db
    depends_on:
      - db
    volumes:
      - ./media:/app/media
      - ./app:/app/app
    command: ["bash", "/app/entrypoint.sh"]

  frontend:
    build: ./hotel-frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0"]

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: hotel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: