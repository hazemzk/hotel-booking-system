<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .hotel-building { fill: #0066cc; }
      .hotel-window { fill: #ffcc00; }
      .hotel-door { fill: #8B4513; }
      .hotel-roof { fill: #cc0000; }
    </style>
  </defs>
  
  <!-- Roof -->
  <polygon points="10,35 50,10 90,35" class="hotel-roof"/>
  
  <!-- Building -->
  <rect x="15" y="35" width="70" height="50" class="hotel-building"/>
  
  <!-- Windows Row 1 -->
  <rect x="22" y="42" width="10" height="10" class="hotel-window"/>
  <rect x="38" y="42" width="10" height="10" class="hotel-window"/>
  <rect x="54" y="42" width="10" height="10" class="hotel-window"/>
  <rect x="70" y="42" width="10" height="10" class="hotel-window"/>
  
  <!-- Windows Row 2 -->
  <rect x="22" y="58" width="10" height="10" class="hotel-window"/>
  <rect x="38" y="58" width="10" height="10" class="hotel-window"/>
  <rect x="54" y="58" width="10" height="10" class="hotel-window"/>
  <rect x="70" y="58" width="10" height="10" class="hotel-window"/>
  
  <!-- Door -->
  <rect x="44" y="75" width="12" height="15" class="hotel-door"/>
  <circle cx="54" cy="82.5" r="1.5" fill="#FFD700"/>
  
  <!-- Flag on top -->
  <line x1="50" y1="10" x2="50" y2="5" stroke="#333" stroke-width="1"/>
  <polygon points="50,5 58,8 50,11" fill="#cc0000"/>
</svg>